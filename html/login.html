<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Inventario ADSO</title>
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body style="margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0e2a38 0%, #00324d 35%, #0f4d41 100%); font-family: Arial, sans-serif; color: #12324a;">
    <main style="width: min(420px, 90vw); background: rgba(255, 255, 255, 0.96); border-radius: 20px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2); padding: 2rem 1.8rem; border: 1px solid rgba(57, 169, 0, 0.2);">
        <header style="text-align: center; margin-bottom: 1.5rem;">
            <img src="../txt/images.png" alt="Logo del SENA" style="width: 120px; height: 120px; object-fit: contain; display: block; margin: 0 auto 1rem;">
            <h1 style="margin: 0 0 0.4rem; font-size: 2rem; color: #00324d;">Inventario Sena</h1>
            <p style="margin: 0; color: #4a5b66; font-size: 0.98rem;">Ingresa tus credenciales para continuar</p>
        </header>
        <form action="dashboard.html" method="get" style="display: flex; flex-direction: column; gap: 1.1rem;">
            <div style="display: flex; flex-direction: column; gap: 0.45rem;">
                <label for="correo" style="font-weight: 600; color: #12324a;">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="sena@correo.com" required style="width: 100%; box-sizing: border-box; padding: 0.85rem 0.9rem; border: 1px solid #bfd0db; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; background: #f8fbfd;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.45rem;">
                <label for="clave" style="font-weight: 600; color: #12324a;">Contraseña</label>
                <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" required style="width: 100%; box-sizing: border-box; padding: 0.85rem 0.9rem; border: 1px solid #bfd0db; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; background: #f8fbfd;">
            </div>

            <div style="display: flex; align-items: center; justify-content: flex-start; font-size: 0.92rem; color: #3a4d59;">
                <label for="recordar" style="display: inline-flex; align-items: center; gap: 0.55rem; cursor: pointer;">
                    <input type="checkbox" id="recordar" name="recordar" style="width: 1rem; height: 1rem; accent-color: #39a900;">
                    Recordarme
                </label>
            </div>

            <button type="submit" style="border: none; border-radius: 10px; background: linear-gradient(135deg, #39a900 0%, #2c8b00 100%); color: #fff; font-weight: 700; font-size: 1rem; padding: 0.95rem 1rem; cursor: pointer; box-shadow: 0 10px 20px rgba(57, 169, 0, 0.25); transition: transform 0.2s ease, box-shadow 0.2s ease;">Ingresar</button>
        </form>

        <p style="margin: 1.25rem 0 0; text-align: center; color: #4a5b66; font-size: 0.96rem;">¿No tienes cuenta? <a href="registro.html" style="color: #00324d; font-weight: 700; text-decoration: none;">Regístrate</a></p>

        <footer style="margin-top: 1.2rem; text-align: center; font-size: 0.82rem; color: #667682;">2026 SENA - ADSO Mixtape</footer>
    </main>
</body>
</html>
