<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Inventario </title>
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body style="margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #00324d 0%, #0f4d41 50%, #39a900 100%); font-family: Arial, sans-serif; color: #e7f2e8;">
    <main style="width: min(420px, 90vw); background: #101a13; border-radius: 20px; box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 28px rgba(57, 169, 0, 0.12); padding: 2rem 1.8rem; border: 1px solid rgba(90, 190, 62, 0.3);">
        <header style="text-align: center; margin-bottom: 1.5rem;">
            <img src="../img/images.png" alt="Logo del SENA" style="width: 120px; height: 120px; object-fit: contain; display: block; margin: 0 auto 1rem; border-radius: 50%;">
            <h1 style="margin: 0 0 0.4rem; font-size: 2rem; color: #f0f8f0;">Inventario Sena</h1>
            <p style="margin: 0; color: #a8b8aa; font-size: 0.98rem;">Ingresa tus credenciales para continuar</p>
        </header>
        <form action="dashboard.html" method="get" style="display: flex; flex-direction: column; gap: 1.1rem;">
            <div style="display: flex; flex-direction: column; gap: 0.45rem;">
                <label for="correo" style="font-weight: 600; color: #dce9dd;">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="sena@correo.com" required style="width: 100%; box-sizing: border-box; padding: 0.85rem 0.9rem; border: 1px solid #35483a; border-radius: 10px; font-size: 1rem; color: #eff8f0; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; background: #0a120c;">
            </div>

            <div style="display: flex; flex-direction: column; gap: 0.45rem;">
                <label for="clave" style="font-weight: 600; color: #dce9dd;">Contraseña</label>
                <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" required style="width: 100%; box-sizing: border-box; padding: 0.85rem 0.9rem; border: 1px solid #35483a; border-radius: 10px; font-size: 1rem; color: #eff8f0; outline: none; transition: border-color 0.2s ease, box-shadow 0.2s ease; background: #0a120c;">
            </div>

            <div style="display: flex; align-items: center; justify-content: flex-start; font-size: 0.92rem; color: #b7c8b9;">
                <label for="recordar" style="display: inline-flex; align-items: center; gap: 0.55rem; cursor: pointer;">
                    <input type="checkbox" id="recordar" name="recordar" style="width: 1rem; height: 1rem; accent-color: #39a900;">
                    Recordarme
                </label>
            </div>

            <button type="submit" style="border: none; border-radius: 10px; background: linear-gradient(135deg, #39a900 0%, #2c8b00 100%); color: #fff; font-weight: 700; font-size: 1rem; padding: 0.95rem 1rem; cursor: pointer; box-shadow: 0 10px 20px rgba(57, 169, 0, 0.25); transition: transform 0.2s ease, box-shadow 0.2s ease;">Ingresar</button>
        </form>

        <p style="margin: 1.25rem 0 0; text-align: center; color: #a8b8aa; font-size: 0.96rem;">¿No tienes cuenta? <a href="#" style="color: #65cf42; font-weight: 700; text-decoration: none;">Regístrate</a></p>

        <footer style="margin-top: 1.2rem; text-align: center; font-size: 0.82rem; color: #77877a;">2026 SENA - ADSO Mixtape</footer>
    </main>
</body>
</html>
