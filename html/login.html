<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Inventario ADSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body class="login-fondo">
    <main class="login-card card shadow-lg">
        <header class="login-encabezado">
            <div class="login-logo mb-3">
                <img class="img-fluid rounded-circle" src="../img/images.png" alt="Logo del SENA" width="90" height="90">
            </div>
            <h1>Inventario Sena</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </header>
        <form action="dashboard.html" method="get">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" name="correo" placeholder="sena@correo.com" required>
            </div>

            <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="recordar" name="recordar">
                <label for="recordar" class="form-check-label">Recordarme</label>
            </div>

            <button type="submit" class="btn btn-sena btn-lg w-100">Ingresar</button>
        </form>

        <p class="login-pie">¿No tienes cuenta? <a href="registro.html" class="link-success fw-bold">Regístrate</a></p>

        <footer class="login-pie">2026 SENA - ADSO Mixtape</footer>
    </main>
</body>
</html>
