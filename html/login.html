<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Inventario ADSO</title>
    <link href="../css/estilos.css" rel="stylesheet">
</head>
<body class="login-fondo">
    <main class="login-card">
        <header class="login-encabezado">
            <div class="login-logo" aria-label="Logo SENA">
                <svg viewBox="0 0 120 120" role="img" aria-hidden="true">
                    <circle cx="60" cy="60" r="56" fill="#00324d"></circle>
                    <circle cx="60" cy="60" r="42" fill="#39a900"></circle>
                    <path d="M32 78 L48 42 H58 L44 78 H32 Z M52 78 L68 42 H78 L62 78 H52 Z M70 78 L76 78 L57 42 H47 L70 78 Z" fill="#ffffff"></path>
                    <path d="M44 36 H76 L73 46 H47 L44 36 Z" fill="#ffffff" opacity="0.9"></path>
                </svg>
            </div>
            <h1>Inventario Sena</h1>
            <p>Ingresa tus credenciales para continuar</p>
        </header>

        <form class="login-form" action="dashboard.html" method="get">
            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="sena@correo.com" required>
            </div>

            <div class="campo">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <div class="extras">
                <div>
                    <input type="checkbox" id="recordar" name="recordar">
                    <label for="recordar">Recordarme</label>
                </div>
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <p class="login-pie">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>

        <footer class="login-pie">2026 SENA - ADSO Mixtape</footer>
    </main>
</body>
</html>
