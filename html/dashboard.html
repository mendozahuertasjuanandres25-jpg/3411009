<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel principal - Inventario ADSO</title>
    <link href="../css/estilos.css" rel="stylesheet">
    <link href="../css/menu.css" rel="stylesheet">
</head>
<body class="dashboard-page">
    <button class="menu-fondo" type="button" data-menu-close aria-label="Cerrar menú" aria-hidden="true" tabindex="-1"></button>

    <aside class="menu-lateral" id="menuLateral" aria-label="Menú principal" aria-hidden="true" inert>
        <div class="menu-cabecera">
            <a class="marca" href="dashboard.html" aria-label="Inventario SENA, panel principal">
                <img class="marca-logo" src="../img/images.png" alt="Logo del SENA" width="48" height="48">
                <span>Inventario <strong>SENA</strong></span>
            </a>
            <button class="boton-cerrar" type="button" data-menu-close aria-label="Cerrar menú">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>

        <div class="menu-seccion">
            <p class="menu-etiqueta">Navegación</p>
            <nav class="menu-enlaces" aria-label="Navegación principal">
                <!-- La clase menu-enlace aplica a todos los vínculos el formato, el espaciado y los estados visuales definidos para la navegación lateral. La clase activo se añade únicamente a la opción correspondiente a la página que se está mostrando; junto con aria-current="page", permite identificarla visualmente y comunicarla a las tecnologías de asistencia. -->
                <a class="menu-enlace activo" href="dashboard.html" aria-current="page"><span aria-hidden="true">⌂</span> <span>Panel principal</span></a>
                <!-- La clase menu-enlace mantiene este acceso con la apariencia y el comportamiento comunes del menú. El destino inventario.html abre la sección donde se consultan y administran los elementos registrados; no se usa la clase activo porque esta página no es la vista actual. -->
                <a class="menu-enlace" href="inventario.html"><span aria-hidden="true">▣</span> <span>Inventario</span></a>
                <!-- La clase menu-enlace conserva la presentación uniforme de esta opción dentro de la navegación. El vínculo conduce a movimientos.html, donde se revisan las entradas y salidas de elementos, y permanece sin la clase activo mientras no se visite esa sección. -->
                <a class="menu-enlace" href="movimientos.html"><span aria-hidden="true">↔</span> <span>Movimientos</span></a>
                <!-- La clase menu-enlace aplica los estilos compartidos con las demás opciones del menú. El destino reportes.html permite acceder a los informes del inventario; esta opción solo debería recibir la clase activo cuando dicha página sea la vista abierta. -->
                <a class="menu-enlace" href="reportes.html"><span aria-hidden="true">▤</span> <span>Reportes</span></a>
            </nav>
        </div>

        <div class="menu-pie">
            <p>Última actualización</p>
            <a class="menu-enlace menu-salir" href="login.html"><span aria-hidden="true">↩</span> <span>Cerrar sesión</span></a>
        </div>
    </aside>

    <button class="boton-menu" type="button" data-menu-toggle aria-controls="menuLateral" aria-expanded="false" aria-label="Abrir menú">
        <span></span><span></span><span></span>
    </button>
                </li>
            </ul>
        </section>
    </main>

    <script src="../js/menu.js" defer></script>
</body>
</html>
