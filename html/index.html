<!DOCTYPE html>
<!-- lang es para lenguaje es = español-->
<html lang="es">
<head>
    <!--utf -8 es hora colombiana-->
    <meta charset="UTF-8">
    <!-- meta name=..... es para que la pagina sea de la escala de la pantalla-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--title es el encabezado de la pagina-->
    <title>Iniciar sesion de inventario ADSO</title>
    <link href="../css/estilos.css" rel="stylesheet">
    <!--llama los estilos persolanizados-->
</head>
<body>
    <main><!--contenido principal de la pagina-->
    <header><!--encabezado de logion-->
    <h1>Inventario Sena</h1><!--h# es para titulos-->
    <p>Ingresa tus credenciales para continuar</p>
    </header>

    <form action="dashboard.html" method="get">

<!--form permite crear el contenido de un formulario cuando se envia nos lleva a la ruta(dashboard)-->
<!--method con envia la informacion con get-->

<div><!--div permite agrupar un contenido en un contenedor-->

<label for="correo">correo electronico</label>
<!--label es una etiqueta de texto que con el for conecta con el input-->
<input type="email" id="correo" placeholder="sena@correo.com" required>
    <!--type obliga que tenga el@, placeholder el texto de ejemplo required es q es un campo obligatorio-->



</div>

<div>
    <label for="clave">contraseña</label>
    <input type="password" id="clave" placeholder="minimo 6 caracteres" minlength="6" required>
</div>

<div>


<input type="checkbox" id="recordar">
<label for="recordar">recordarme</label><!-- type checkbox es caslla de verificacion-->

</div>

<button type="subimit">ingresar</button><!--envia el formulario antes revisa los campos required email y minlengt-->


    </form><!--cierra el formulario-->


    <p>¿no tienes cuenta?<a href="registro.html">registrate</a></p>

<footer>2026 SENA - ADSO Mixtape</footer>
<!--es el pie de la pagina-->
</main>



</body>




</html>
