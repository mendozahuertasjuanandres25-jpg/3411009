<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06251f">
    <title>Crear cuenta - Inventario SENA</title>
    <link href="../css/registro.css" rel="stylesheet">
</head>
<body class="registro-pagina">
    <main class="registro-card">
        <header class="registro-encabezado">
            <div class="registro-logo">
                <img src="../img/images.png" alt="Logo del SENA" width="72" height="72">
            </div>
            <p class="registro-marca">Inventario <strong>SENA</strong></p>
            <p class="registro-etiqueta">GESTIÓN DE INVENTARIO</p>
            <h1>Crea tu cuenta</h1>
            <p class="registro-descripcion">Ingresa tus datos para comenzar a gestionar tu inventario.</p>
        </header>

        <form class="registro-formulario" id="registro-formulario" action="dashboard.html" method="get">
            <div class="registro-campo">
                <label for="nombre">Nombre completo</label>
                <div class="registro-control">
                    <svg class="registro-icono" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.5"></circle>
                        <path d="M5 20a7 7 0 0 1 14 0"></path>
                    </svg>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" autocomplete="name" required>
                </div>
            </div>

            <div class="registro-campo">
                <label for="correo">Correo electrónico</label>
                <div class="registro-control">
                    <svg class="registro-icono" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m4 7 8 6 8-6"></path>
                    </svg>
                    <input type="email" id="correo" name="correo" placeholder="nombre@correo.com" autocomplete="email" required>
                </div>
            </div>

            <div class="registro-campo">
                <label for="clave">Contraseña</label>
                <div class="registro-control">
                    <svg class="registro-icono" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                        <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path>
                    </svg>
                    <input type="password" id="clave" name="clave" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
                </div>
            </div>

            <div class="registro-campo">
                <label for="confirmar-clave">Confirmar contraseña</label>
                <div class="registro-control">
                    <svg class="registro-icono" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                        <path d="m9 16 2 2 4-4"></path>
                    </svg>
                    <input type="password" id="confirmar-clave" name="confirmar-clave" placeholder="Repite tu contraseña" minlength="6" autocomplete="new-password" aria-describedby="confirmar-ayuda" required>
                </div>
                <p class="registro-error" id="confirmar-ayuda" aria-live="polite" hidden></p>
            </div>

            <button class="registro-boton" type="submit">Registrarme</button>
        </form>

        <p class="registro-pie">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </main>
    <script src="../js/registro.js" defer></script>
</body>
</html>
